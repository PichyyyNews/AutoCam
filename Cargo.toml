[package]
name = "autocam"
version = "0.0.15"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "image", "svg", "tokio"] }
nokhwa = { version = "0.10.11", features = ["input-native"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
image = "0.25"
tokio = { version = "1", features = ["sync", "time"] }
nnnoiseless = "0.5.2"

[target.'cfg(windows)'.dependencies]
virtualcam = { version = "1.0.0", default-features = false, features = ["obs", "media-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
virtualcam = { version = "1.0.0", default-features = false, features = ["v4l2"] }

[target.'cfg(target_os = "macos")'.dependencies]
virtualcam = { version = "1.0.0", default-features = false }

[build-dependencies]
winres = "0.1"

# ==============================================================================
# Full Speed Release Profile: Maximum Runtime Performance & Minimal Binary Size
# ==============================================================================
[profile.release]
opt-level = 3        # Aggressive optimizations
lto = "fat"          # Link-Time Optimization across all crates
codegen-units = 1    # Maximizes inlining & optimizations across compilation units
panic = "abort"      # Disables stack unwinding for reduced overhead and size
strip = true         # Strips all debug symbols
