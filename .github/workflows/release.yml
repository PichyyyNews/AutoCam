name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            msvc_arch: ''
            binary_name: autocam.exe
            archive_name: autocam-windows-x86_64.zip
            standalone_asset: autocam.exe

          - name: Windows x86 (32-bit)
            os: windows-latest
            target: i686-pc-windows-msvc
            msvc_arch: 'x86'
            binary_name: autocam.exe
            archive_name: autocam-windows-i686.zip
            standalone_asset: autocam-x86.exe

          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            msvc_arch: 'x64_arm64'
            binary_name: autocam.exe
            archive_name: autocam-windows-arm64.zip
            standalone_asset: autocam-arm64.exe

          - name: macOS Intel (x86_64)
            os: macos-13
            target: x86_64-apple-darwin
            msvc_arch: ''
            binary_name: autocam
            archive_name: autocam-macos-x86_64.tar.gz
            standalone_asset: ''

          - name: macOS Apple Silicon (ARM64)
            os: macos-14
            target: aarch64-apple-darwin
            msvc_arch: ''
            binary_name: autocam
            archive_name: autocam-macos-arm64.tar.gz
            standalone_asset: ''

          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            msvc_arch: ''
            binary_name: autocam
            archive_name: autocam-linux-x86_64.tar.gz
            standalone_asset: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libv4l-dev libfontconfig1-dev libxkbcommon-dev pkg-config

      - name: Setup MSVC environment
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination staging/
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination staging/ }
          Compress-Archive -Path staging/* -DestinationPath "${{ matrix.archive_name }}"
          if ("${{ matrix.standalone_asset }}" -ne "") {
            Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination "${{ matrix.standalone_asset }}"
          }

      - name: Package Release (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" staging/
          chmod +x "staging/${{ matrix.binary_name }}"
          if [ -f "README.md" ]; then cp "README.md" staging/; fi
          tar -czvf "${{ matrix.archive_name }}" -C staging .

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.standalone_asset }}
          generate_release_notes: true
          draft: false
          prerelease: false
